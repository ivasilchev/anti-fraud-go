name: anti-fraud-go

# The event log is an SQLite file on the data volume, next to the snapshot.
x-db-env: &db-env
  DB_PATH: /data/events.db

services:
  app:
    build: .
    image: anti-fraud-go:latest
    environment:
      <<: *db-env
      # Tuned from the SPEC's 1500MiB: ~500 MB live heap with GOGC=200 would
      # otherwise grow to the limit and exceed the 1.2 GB RSS budget.
      GOMEMLIMIT: ${GOMEMLIMIT:-1100MiB}
      GOGC: ${GOGC:-200}
      # Set to an empty string to disable snapshots (forces a full replay).
      SNAPSHOT_PATH: ${SNAPSHOT_PATH-/data/snapshot.bin}
      TEST_MODE: ${TEST_MODE:-false}
      PPROF: ${PPROF:-0}
    ports:
      - "8080:8080"
    volumes:
      - data:/data
    restart: unless-stopped
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD", "/usr/local/bin/server", "healthcheck"]
      interval: 2s
      timeout: 3s
      retries: 3
      # Replaying 10M events takes a while; failures don't count meanwhile.
      start_period: 10m
      start_interval: 1s
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2g

  generate:
    image: anti-fraud-go:latest
    profiles: ["generate"]
    entrypoint: ["/usr/local/bin/generate"]
    command:
      - --players=${PLAYERS:-1000000}
      - --events=${EVENTS:-10000000}
      - --days=${DAYS:-90}
      - --seed=${SEED:-42}
      - --manifest=/manifest/manifest.json
    environment: *db-env
    volumes:
      - data:/data
      - manifest:/manifest

  verify:
    image: anti-fraud-go:latest
    profiles: ["generate"]
    entrypoint: ["/usr/local/bin/verify"]
    command: ["--manifest=/manifest/manifest.json", "--url=http://app:8080"]
    volumes:
      - manifest:/manifest

  k6:
    image: grafana/k6:2.3.0
    profiles: ["load"]
    command: ["run", "--quiet", "/load/k6.js"]
    environment:
      BASE_URL: http://app:8080
      RUN_ID: ${RUN_ID:-}
      DURATION: ${DURATION:-10m}
      PLAYERS: ${PLAYERS:-1000000}
    volumes:
      - ./load:/load:ro
      - ./load/results:/results
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 2g

volumes:
  data:
  manifest:
